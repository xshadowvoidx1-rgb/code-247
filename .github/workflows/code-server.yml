name: Code Server

on:
  workflow_dispatch:

concurrency:
  group: code-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint scripts
        run: |
          echo "checking scripts"
          bash -n scripts/run.sh
          bash -n scripts/watchdog.sh
          echo "syntax OK"
      - name: Smoke test
        run: |
          node -e "console.log('node ok', process.version)"
          echo "smoke test passed"
